services:
  - type: web
    name: spranalytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SPR_BEHIND_PROXY
        value: "1"
      - key: SPR_PASSWORD
        sync: false  
